# Server with an NVIDIA GPU. From the repo root:
#   docker compose -f docker-compose.gpu.yml up --build -d
#   ./scripts/verify_deploy.sh --gpu

services:
  stt:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "${STT_BIND:-0.0.0.0}:${STT_PORT:-8080}:8080"
    environment:
      DATA_DIR: /app/data
      STATIC_DIR: /app/static
      PORT: "8080"
      CORS_ORIGINS: "http://127.0.0.1:8080,http://localhost:8080"
      STT_REQUIRE_GPU: "1"
    env_file:
      - path: backend/.env
        required: false
    volumes:
      - stt-data:/app/data
      - ${STT_HF_CACHE_HOST:-./docker-bundled-models/huggingface}:/root/.cache/huggingface
    restart: unless-stopped
    mem_limit: 16g
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  stt-data:
